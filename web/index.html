<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Amoxtli · Legislación Mexicana</title>
<script src="https://cdn.jsdelivr.net/npm/vis-network@9.1.2/dist/vis-network.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;450;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap');

/* ───────────────────────────────────────────────
   Muted botanical · solid panels · ink borders
   No glassmorphism, no gradients, no emoji.
   ─────────────────────────────────────────────── */
:root {
  --cream:      #f7f1e6;
  --warm-white: #fbf7ef;
  --panel:      #f4ecdd;
  --sand:       #ece0ca;
  --earth:      #b98a5e;
  --terracotta: #b0674a;
  --sage:       #7a9c81;
  --forest:     #4f6b4d;
  --deep-green: #38503a;
  --ocean:      #35766a;
  --golden:     #b98a2e;
  --text:       #33291f;
  --text-soft:  #63564a;
  --text-faint: #9c8b74;
  --ink-border: #cdbfa4;
  --ink-line:   #b7a684;
  --shadow:     0 1px 2px rgba(60,40,20,0.06);
  --shadow-lg:  0 3px 14px rgba(60,40,20,0.10);
}

* { margin:0; padding:0; box-sizing:border-box }
html { font-size: 16px; -webkit-font-smoothing: antialiased }
body {
  font-family: 'Inter', system-ui, sans-serif;
  background: var(--cream);
  color: var(--text);
  overflow: hidden; height: 100vh; width: 100vw;
}

/* Subtle paper grain, no bright glows */
body::after {
  content: ''; position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.025'/%3E%3C/svg%3E");
  opacity: 0.5;
}

#graph { position:fixed; inset:0; z-index:1 }

/* ── Header ── */
.header {
  position: fixed; top: 22px; left: 24px; z-index: 30;
  display: flex; align-items: center; gap: 13px;
}
.header-mark {
  width: 40px; height: 40px; border-radius: 8px;
  background: var(--forest); color: var(--cream);
  display: flex; align-items: center; justify-content: center;
  border: 1px solid var(--deep-green); box-shadow: var(--shadow);
}
.header-mark svg { width: 22px; height: 22px; }
.header h1 {
  font-family: 'Newsreader', Georgia, serif;
  font-size: 22px; font-weight: 500; letter-spacing: -0.2px; color: var(--deep-green);
}
.header-sub {
  font-size: 10.5px; color: var(--text-soft); letter-spacing: 0.4px; font-weight: 450;
}

/* ── Level dots ── */
.level-indicator {
  position: fixed; top: 28px; right: 28px; z-index: 30;
  display: flex; align-items: center; gap: 8px;
  font-size: 10.5px; color: var(--text-soft); font-weight: 500;
}
.level-dots { display: flex; gap: 5px; }
.level-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--ink-line); transition: all 0.4s ease; }
.level-dot.on { background: var(--forest); width: 8px; height: 8px; }

/* ── Back ── */
.back-btn {
  position: fixed; top: 50%; left: 14px; transform: translateY(-50%); z-index: 30;
  width: 36px; height: 36px; border-radius: 8px;
  background: var(--warm-white); border: 1px solid var(--ink-border); cursor: pointer;
  display: none; align-items: center; justify-content: center;
  font-size: 15px; color: var(--text-soft); box-shadow: var(--shadow); transition: all 0.2s;
}
.back-btn:hover { color: var(--forest); border-color: var(--forest); }
.back-btn.on { display: flex; }

/* ── Category chip (shows the hovered node's materia) ── */
.cat-chip {
  position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%) translateY(6px);
  z-index: 30; display: flex; align-items: center; gap: 8px;
  padding: 7px 14px; font-size: 12px; font-weight: 500; color: var(--text);
  background: var(--warm-white); border: 1px solid var(--ink-border); border-radius: 20px;
  box-shadow: var(--shadow-lg); opacity: 0; pointer-events: none;
  transition: opacity 0.18s ease, transform 0.18s ease; white-space: nowrap; max-width: 90vw;
}
.cat-chip.on { opacity: 1; transform: translateX(-50%) translateY(0); }
.cat-chip .cat-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; background: var(--dot-color, #aaa); }
.cat-chip .cat-name { color: var(--text-faint); font-weight: 450; }

/* ── Search ── */
.search-wrap {
  position: fixed; top: 22px; left: 50%; transform: translateX(-50%); z-index: 30;
  width: min(440px, 56vw);
}
.search-input {
  width: 100%; padding: 11px 18px;
  background: var(--warm-white); border: 1px solid var(--ink-border); border-radius: 9px;
  font-family: inherit; font-size: 13px; color: var(--text);
  outline: none; box-shadow: var(--shadow); transition: border-color 0.2s;
}
.search-input::placeholder { color: var(--text-faint); }
.search-input:focus { border-color: var(--forest); }
.search-results {
  display: none; margin-top: 6px;
  background: var(--warm-white); border: 1px solid var(--ink-border); border-radius: 10px;
  max-height: 340px; overflow-y: auto; box-shadow: var(--shadow-lg);
}
.search-results.on { display: block; }
.search-r { padding: 10px 16px; border-bottom: 1px solid var(--ink-border); cursor: pointer; transition: background 0.15s; }
.search-r:hover { background: var(--panel); }
.search-r:last-child { border-bottom: none; }
.search-r .r-law { color: var(--forest); font-weight: 550; font-size: 11.5px; margin-bottom: 2px; }
.search-r .r-text { font-size: 12px; color: var(--text-soft); line-height: 1.45; }
.search-r .r-score { font-size: 10px; color: var(--text-faint); margin-top: 2px; }
.search-pager {
  padding: 8px 16px; font-size: 10.5px; color: var(--text-faint);
  display: flex; justify-content: space-between; align-items: center;
  border-top: 1px solid var(--ink-border); background: var(--panel);
}
.search-pager .hint { color: var(--forest); font-weight: 500; }

/* ── Results page (Google-style) ── */
.results-page {
  position: fixed; inset: 0; z-index: 45; background: var(--cream);
  display: none; flex-direction: column;
}
.results-page.on { display: flex; }
.results-top {
  padding: 20px 28px 16px; border-bottom: 1px solid var(--ink-border);
  display: flex; align-items: center; gap: 16px; background: var(--warm-white);
}
.results-back {
  width: 36px; height: 36px; border-radius: 8px; flex-shrink: 0;
  background: var(--warm-white); border: 1px solid var(--ink-border); cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 15px; color: var(--text-soft); transition: all 0.2s;
}
.results-back:hover { color: var(--forest); border-color: var(--forest); }
.results-search {
  flex: 1; max-width: 620px; padding: 11px 18px;
  background: var(--cream); border: 1px solid var(--ink-border); border-radius: 9px;
  font-family: inherit; font-size: 14px; color: var(--text); outline: none;
}
.results-search:focus { border-color: var(--forest); }
.results-count { font-size: 11.5px; color: var(--text-faint); white-space: nowrap; }
.results-list { flex: 1; overflow-y: auto; padding: 24px 28px 60px; }
.results-inner { max-width: 720px; margin: 0 auto; }
.result-doc { padding: 16px 0; border-bottom: 1px solid var(--ink-border); cursor: pointer; }
.result-doc:hover .rd-title { color: var(--terracotta); }
.rd-materia { font-size: 11px; color: var(--text-faint); margin-bottom: 3px; }
.rd-title {
  font-family: 'Newsreader', Georgia, serif; font-size: 18px; font-weight: 550;
  color: var(--forest); line-height: 1.3; transition: color 0.15s;
}
.rd-snippet { font-size: 13px; color: var(--text-soft); line-height: 1.55; margin-top: 5px; }
.rd-meta { font-size: 10.5px; color: var(--text-faint); margin-top: 6px; }
.results-empty { text-align: center; color: var(--text-faint); padding: 60px 0; font-size: 14px; }

/* ── Reader (raw document text) ── */
.reader {
  position: fixed; inset: 0; z-index: 55; background: var(--warm-white);
  display: none; flex-direction: column;
}
.reader.on { display: flex; }
.reader-top {
  padding: 18px 28px; border-bottom: 1px solid var(--ink-border);
  display: flex; align-items: center; gap: 16px; background: var(--cream);
}
.reader-back {
  width: 36px; height: 36px; border-radius: 8px; flex-shrink: 0;
  background: var(--warm-white); border: 1px solid var(--ink-border); cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 15px; color: var(--text-soft); transition: all 0.2s;
}
.reader-back:hover { color: var(--forest); border-color: var(--forest); }
.reader-title { font-family: 'Newsreader', Georgia, serif; font-size: 18px; font-weight: 550; color: var(--deep-green); line-height: 1.3; }
.reader-body { flex: 1; overflow-y: auto; padding: 40px 28px 80px; }
.reader-text {
  max-width: 760px; margin: 0 auto;
  font-family: 'Newsreader', Georgia, serif; font-size: 16px; line-height: 1.75;
  color: var(--text); white-space: pre-wrap; word-wrap: break-word;
}
.reader-text mark { background: var(--golden); color: var(--warm-white); padding: 0 2px; border-radius: 2px; }

/* ── Entity legend ── */
.entity-legend {
  position: fixed; bottom: 66px; left: 50%; transform: translateX(-50%); z-index: 30;
  display: flex; gap: 12px;
  background: var(--panel); border: 1px solid var(--ink-border); border-radius: 8px;
  padding: 5px 14px; box-shadow: var(--shadow);
}
.entity-legend-item { display: flex; align-items: center; gap: 5px; font-size: 10px; color: var(--text-soft); font-weight: 450; }
.entity-dot { width: 7px; height: 7px; border-radius: 2px; background: var(--ec, #aaa); }

/* ── Info panel ── */
.info-panel {
  position: fixed; top: 50%; right: -360px; transform: translateY(-50%); z-index: 25; width: 300px;
  max-height: 80vh; overflow-y: auto;
  background: var(--warm-white); border: 1px solid var(--ink-border); border-radius: 12px;
  padding: 22px; transition: right 0.35s cubic-bezier(0.16,1,0.3,1); box-shadow: var(--shadow-lg);
}
.info-panel.open { right: 22px; }
.info-panel h3 { font-family: 'Newsreader', Georgia, serif; font-size: 17px; font-weight: 550; line-height: 1.3; color: var(--deep-green); }
.info-type { font-size: 9.5px; color: var(--text-faint); text-transform: uppercase; letter-spacing: 0.8px; font-weight: 500; margin: 4px 0 14px; }
.info-body { font-size: 12px; line-height: 1.6; color: var(--text-soft); }
.info-body strong { color: var(--text); font-weight: 600; }
.info-close { position: absolute; top: 14px; right: 16px; background: none; border: none; color: var(--text-faint); cursor: pointer; font-size: 16px; }
.info-close:hover { color: var(--text); }
.read-btn {
  display: inline-block; margin-bottom: 14px; padding: 8px 14px;
  background: var(--forest); color: var(--cream); border: 1px solid var(--deep-green);
  border-radius: 8px; font-family: inherit; font-size: 12px; font-weight: 500;
  cursor: pointer; transition: background 0.2s;
}
.read-btn:hover { background: var(--deep-green); }

/* ── Chat (ChatGPT-style drawer) ── */
.chat-trigger {
  position: fixed; bottom: 24px; right: 22px; z-index: 31;
  display: flex; align-items: center; gap: 8px;
  padding: 10px 16px; border-radius: 9px;
  background: var(--forest); color: var(--cream); border: 1px solid var(--deep-green);
  cursor: pointer; font-family: inherit; font-size: 13px; font-weight: 500;
  box-shadow: var(--shadow-lg); transition: background 0.2s;
}
.chat-trigger:hover { background: var(--deep-green); }
.chat-trigger svg { width: 16px; height: 16px; }

.chat-panel {
  position: fixed; top: 0; right: -520px; height: 100vh; width: min(460px, 96vw); z-index: 40;
  background: var(--warm-white); border-left: 1px solid var(--ink-border);
  display: flex; flex-direction: column; box-shadow: -6px 0 30px rgba(60,40,20,0.12);
  transition: right 0.35s cubic-bezier(0.16,1,0.3,1);
}
.chat-panel.on { right: 0; }
.chat-header {
  padding: 18px 20px; border-bottom: 1px solid var(--ink-border);
  display: flex; align-items: center; justify-content: space-between;
}
.chat-title { font-family: 'Newsreader', Georgia, serif; font-size: 17px; font-weight: 550; color: var(--deep-green); }
.chat-header .meta { display: flex; align-items: center; gap: 10px; }
.chat-badge { font-size: 9.5px; background: var(--sand); color: var(--forest); padding: 3px 9px; border-radius: 5px; font-weight: 550; letter-spacing: 0.3px; }
.chat-x { background: none; border: none; color: var(--text-faint); cursor: pointer; font-size: 20px; line-height: 1; }
.chat-x:hover { color: var(--text); }
.chat-messages { flex: 1; overflow-y: auto; padding: 22px 20px; display: flex; flex-direction: column; gap: 18px; }
.chat-turn { display: flex; gap: 12px; }
.chat-turn.user { flex-direction: row-reverse; }
.chat-av {
  width: 28px; height: 28px; border-radius: 7px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-family: 'Newsreader', serif; font-size: 13px; font-weight: 600;
}
.chat-turn.bot .chat-av { background: var(--forest); color: var(--cream); }
.chat-turn.user .chat-av { background: var(--sand); color: var(--text-soft); border: 1px solid var(--ink-border); }
.chat-bubble { font-size: 13.5px; line-height: 1.62; color: var(--text); max-width: 80%; }
.chat-turn.user .chat-bubble {
  background: var(--panel); border: 1px solid var(--ink-border);
  padding: 10px 14px; border-radius: 10px; color: var(--text-soft);
}
.chat-bubble strong { color: var(--deep-green); font-weight: 600; }
.chat-bubble ul { margin: 6px 0; padding-left: 18px; }
.chat-bubble li { margin-bottom: 3px; }
.chat-bubble.thinking { color: var(--text-faint); font-style: italic; }
.chat-bubble .md-h { font-family: 'Newsreader', Georgia, serif; font-size: 14.5px; font-weight: 600; color: var(--deep-green); margin: 10px 0 4px; }
.law-link { color: var(--forest); font-weight: 550; cursor: pointer; text-decoration: underline; text-decoration-color: var(--ink-line); text-underline-offset: 2px; }
.law-link:hover { color: var(--terracotta); }
.chat-row { padding: 14px 18px 18px; border-top: 1px solid var(--ink-border); display: flex; gap: 10px; align-items: flex-end; }
.chat-row textarea {
  flex: 1; padding: 11px 14px; border: 1px solid var(--ink-border); border-radius: 9px;
  font-family: inherit; font-size: 13px; color: var(--text); outline: none;
  background: var(--cream); resize: none; max-height: 120px; line-height: 1.5;
}
.chat-row textarea:focus { border-color: var(--forest); }
.chat-row button {
  width: 40px; height: 40px; border-radius: 9px; flex-shrink: 0;
  background: var(--forest); border: 1px solid var(--deep-green); color: var(--cream);
  cursor: pointer; font-size: 16px; display: flex; align-items: center; justify-content: center;
  transition: background 0.2s;
}
.chat-row button:hover:not(:disabled) { background: var(--deep-green); }
.chat-row button:disabled { opacity: 0.4; cursor: default; }

/* ── Loading ── */
.loading { position: fixed; inset:0; z-index: 50; display: flex; align-items: center; justify-content: center; background: var(--cream); }
.loading-content { display: flex; flex-direction: column; align-items: center; gap: 16px; }
.loading-spinner { width: 30px; height: 30px; border-radius: 50%; border: 2.5px solid var(--ink-border); border-top-color: var(--forest); animation: spin 0.9s infinite linear; }
@keyframes spin { to { transform: rotate(360deg) } }
.loading-text { font-size: 13px; color: var(--text-soft); }

::-webkit-scrollbar { width: 6px }
::-webkit-scrollbar-thumb { background: var(--ink-border); border-radius: 3px }
</style>
</head>
<body>

<div id="graph"></div>

<header class="header">
  <div class="header-mark">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 21c0-6 0-10 0-16"/><path d="M12 8c3-4 7-4 8-4 0 4-1 8-8 8"/><path d="M12 12c-3-3-6-3-7-3 0 3 1 6 7 6"/>
    </svg>
  </div>
  <div>
    <h1>Amoxtli</h1>
    <div class="header-sub">Códice de Legislación Mexicana</div>
  </div>
</header>

<div class="cat-chip" id="cat-chip"></div>

<div class="search-wrap">
  <input class="search-input" id="search" type="text" placeholder="Buscar por significado — Enter para ver resultados…" autocomplete="off">
  <div class="search-results" id="search-res"></div>
</div>

<button class="chat-trigger" id="chat-trigger">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
  Consultar
</button>

<div class="chat-panel" id="chat-panel">
  <div class="chat-header">
    <span class="chat-title">Tlamatini</span>
    <div class="meta"><button class="chat-x" id="chat-x">×</button></div>
  </div>
  <div class="chat-messages" id="chat-msgs"></div>
  <div class="chat-row">
    <textarea id="chat-input" rows="1" placeholder="Pregunta sobre cualquier ley mexicana…"></textarea>
    <button id="chat-send">→</button>
  </div>
</div>

<div class="info-panel" id="info">
  <button class="info-close" id="info-close">×</button>
  <h3 id="info-title"></h3>
  <div class="info-type" id="info-type"></div>
  <div class="info-body" id="info-body"></div>
</div>

<div class="results-page" id="results-page">
  <div class="results-top">
    <button class="results-back" id="results-back" title="Volver al grafo">←</button>
    <input class="results-search" id="results-search" type="text" placeholder="Buscar en la legislación…" autocomplete="off">
    <span class="results-count" id="results-count"></span>
  </div>
  <div class="results-list"><div class="results-inner" id="results-list"></div></div>
</div>

<div class="reader" id="reader">
  <div class="reader-top">
    <button class="reader-back" id="reader-back" title="Volver">←</button>
    <div class="reader-title" id="reader-title"></div>
  </div>
  <div class="reader-body"><div class="reader-text" id="reader-text"></div></div>
</div>

<div class="loading" id="loading">
  <div class="loading-content"><div class="loading-spinner"></div><div class="loading-text">Cargando el Códice…</div></div>
</div>

<script>
/* ════════════════════════════════════════════════
   Amoxtli · graph + semantic search + chat
   ════════════════════════════════════════════════ */
let net = null, cur = null, clusters = {};

function physicsOff(){ net?.setOptions({physics:{enabled:false}}); }
// Resting state: weak, slow forces so the UMAP seed layout is preserved and nodes
// only breathe a little (Obsidian-style). Hover/drag freezes it so it's clickable.
function physicsGentle(){ net?.setOptions({physics:{ enabled:true, solver:'forceAtlas2Based',
  forceAtlas2Based:{ gravitationalConstant:-14, centralGravity:0.002, springLength:110,
    springConstant:0.006, damping:0.9 },
  timestep:0.25, maxVelocity:0.3, minVelocity:0.08, stabilization:false }}); }

let nodeIndex = {};   // id -> node (for clicks/highlight)

function buildGraph(d){
  if (net){ net.destroy(); net=null; }
  nodeIndex = {};
  const nodes = new vis.DataSet((d.nodes||[]).map(n => {
    nodeIndex[n.id]=n;
    return {
      id:n.id, label:n.label, title:n.title||'', cluster:n.cluster,
      x:n.x, y:n.y,                       // UMAP seed positions
      size:n.size||12, value:n.value||0,
      color: n.color || {background:'#aaa',border:'#8a7a5a'},
      font:{ color:'#33291f', size:10, face:'Inter', strokeWidth:3, strokeColor:'rgba(247,241,230,0.85)' },
      borderWidth:1, borderWidthSelected:2, shape:'dot',
    };
  }));
  const edges = new vis.DataSet((d.edges||[]).map(e => ({
    from:e.from, to:e.to,
    color:{color:'rgba(120,105,80,0.10)',hover:'rgba(53,118,106,0.45)',inherit:false},
    width:0.5, hoverWidth:1.6, smooth:{type:'continuous',roundness:0.3},
  })));
  net = new vis.Network(document.getElementById('graph'), {nodes,edges}, {
    physics:{enabled:true,solver:'forceAtlas2Based',
      forceAtlas2Based:{gravitationalConstant:-14,centralGravity:0.002,springLength:110,springConstant:0.006,damping:0.9},
      stabilization:false, timestep:0.25, maxVelocity:0.3, minVelocity:0.08 },
    interaction:{hover:true,tooltipDelay:300,dragNodes:true,hideEdgesOnDrag:true},
    nodes:{scaling:{min:6,max:48}},
  });
  net.on('hoverNode', p=>{ physicsOff(); showChip(nodeIndex[p.node]); });  // freeze + show materia
  net.on('blurNode', ()=>{ physicsGentle(); hideChip(); });
  net.on('dragStart', physicsOff);            // drag moves only the grabbed node
  net.on('dragEnd', physicsGentle);
  net.on('click', p=>{ if(p.nodes.length){ const n=nodeIndex[p.nodes[0]]; if(n) showInfo(n); } });
  cur = d;
}

async function loadMap(){
  const r=await fetch('/api/graph/map'); const d=await r.json();
  buildGraph(d);
  setTimeout(()=>net?.fit({animation:{duration:500,easingFunction:'easeInOutQuad'}}), 200);
}

async function showInfo(n){
  document.getElementById('info-title').textContent=n.title||n.label;
  document.getElementById('info-type').textContent=clusters[n.cluster]?.label||'Ley';
  const body=document.getElementById('info-body');
  document.getElementById('info').classList.add('open');
  body.innerHTML='<p style="color:var(--text-faint)">Cargando…</p>';
  let d={}; try{ d=await fetch(`/api/law/${encodeURIComponent(n.title||n.label)}`).then(r=>r.json()); }catch(e){}
  // Plain list (institutions) vs. clickable list of laws → open that law's reader.
  const plain=(arr,max=12)=>arr&&arr.length?`<ul>${arr.slice(0,max).map(x=>`<li>${esc(x)}</li>`).join('')}${arr.length>max?`<li style="color:var(--text-faint)">+${arr.length-max} más…</li>`:''}</ul>`:' <span style="color:var(--text-faint)">—</span>';
  const links=(arr,max=12)=>arr&&arr.length?`<ul>${arr.slice(0,max).map(x=>`<li><span class="law-link" data-law="${esc(x).replace(/"/g,'&quot;')}">${esc(x)}</span></li>`).join('')}${arr.length>max?`<li style="color:var(--text-faint)">+${arr.length-max} más…</li>`:''}</ul>`:' <span style="color:var(--text-faint)">—</span>';
  const abro=d.abrogates||[];
  const lawName=(n.title||n.label);
  body.innerHTML=`<button class="read-btn" onclick="openReader('${lawName.replace(/'/g,"\\'")}')">Leer texto completo →</button>`
    +`<p><strong>Rama semántica:</strong> ${esc(clusters[n.cluster]?.label||'—')}</p>`
    +`<p style="margin-top:4px"><strong>Materia:</strong> ${esc(d.materia||'—')}</p>`
    +(abro.length?`<p style="margin-top:8px"><strong>Reemplaza a (abroga):</strong></p>${links(abro,6)}`:'')
    +`<p style="margin-top:8px"><strong>Leyes que cita (${(d.references||[]).length}):</strong></p>${links(d.references)}`
    +`<p style="margin-top:8px"><strong>Instituciones (${(d.institutions||[]).length}):</strong></p>${plain(d.institutions,10)}`;
  body.querySelectorAll('.law-link').forEach(el=>el.onclick=()=>openReader(el.dataset.law));
}
document.getElementById('info-close').addEventListener('click',()=>document.getElementById('info').classList.remove('open'));

/* Category chip: the only "legend" — shows the materia of the hovered node. */
const chipEl=document.getElementById('cat-chip');
function showChip(n){
  if(!n) return;
  const c=clusters[n.cluster]||{};
  chipEl.innerHTML=`<span class="cat-dot" style="--dot-color:#${c.color||'aaa'}"></span>`
    +`<span>${esc(n.title||n.label||'')}</span><span class="cat-name">· ${esc(c.label||'—')}</span>`;
  chipEl.classList.add('on');
}
function hideChip(){ chipEl.classList.remove('on'); }

/* ── Semantic search → results page → reader ──
   The bar shows live doc suggestions; Enter opens a Google-style results page;
   any result (or a law node) opens the raw document text. */
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let lastQuery='';

// The API returns chunk hits (several per law); collapse to one entry per document.
function dedupeDocs(results){
  const seen=new Map();
  for(const r of results){ if(!seen.has(r.law)) seen.set(r.law,r); }
  return [...seen.values()];
}
async function fetchSearch(q){
  const r=await fetch(`/api/search?q=${encodeURIComponent(q)}&k=40`);
  return dedupeDocs((await r.json()).results||[]);
}

/* Live suggestion dropdown */
async function suggest(q){
  const docs=(await fetchSearch(q)).slice(0,6);
  const e=document.getElementById('search-res');
  if(!docs.length){ e.innerHTML='<div style="padding:18px;text-align:center;color:var(--text-faint)">Sin resultados</div>'; e.classList.add('on'); return; }
  e.innerHTML=docs.map(r=>`<div class="search-r" data-law="${esc(r.law)}">
    <div class="r-law">${esc(r.law)}</div><div class="r-text">${esc(r.text.slice(0,120))}</div></div>`).join('')
    +`<div class="search-pager"><span>${docs.length} documentos</span><span class="hint">Enter → todos los resultados</span></div>`;
  e.querySelectorAll('.search-r').forEach(el=>el.onclick=()=>openReader(el.dataset.law));
  e.classList.add('on');
}
let st; const searchEl=document.getElementById('search');
searchEl.addEventListener('input',()=>{
  clearTimeout(st); const q=searchEl.value.trim();
  if(q.length<2){document.getElementById('search-res').classList.remove('on');return}
  st=setTimeout(()=>suggest(q),300);
});
searchEl.addEventListener('keydown',e=>{
  if(e.key!=='Enter')return; e.preventDefault();
  const q=searchEl.value.trim(); if(q.length>=2) openResults(q);
});
document.addEventListener('click',e=>{if(!e.target.closest('.search-wrap'))document.getElementById('search-res').classList.remove('on')});

/* Results page */
async function openResults(q){
  lastQuery=q;
  document.getElementById('search-res').classList.remove('on');
  document.getElementById('results-search').value=q;
  const list=document.getElementById('results-list');
  list.innerHTML='<div class="results-empty">Buscando…</div>';
  document.getElementById('results-page').classList.add('on');
  const docs=await fetchSearch(q);
  document.getElementById('results-count').textContent=docs.length?`${docs.length} documentos`:'';
  if(!docs.length){ list.innerHTML='<div class="results-empty">Sin resultados para “'+esc(q)+'”.</div>'; return; }
  list.innerHTML=docs.map(r=>`<div class="result-doc" data-law="${esc(r.law)}">
    <div class="rd-title">${esc(r.law)}</div>
    <div class="rd-snippet">${esc(r.text.slice(0,240))}…</div>
    <div class="rd-meta">Relevancia · ${r.score}</div></div>`).join('');
  list.querySelectorAll('.result-doc').forEach(el=>el.onclick=()=>openReader(el.dataset.law));
}
document.getElementById('results-back').onclick=()=>document.getElementById('results-page').classList.remove('on');
const rsEl=document.getElementById('results-search');
rsEl.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); const q=rsEl.value.trim(); if(q.length>=2) openResults(q); }});

/* Reader — raw document text (shareable via #ley/NOMBRE) */
async function openReader(law){
  const rd=document.getElementById('reader');
  document.getElementById('reader-title').textContent=law;
  const body=document.getElementById('reader-text');
  body.textContent='Cargando el texto…';
  rd.classList.add('on');
  const h='ley/'+encodeURIComponent(law);
  if(location.hash.slice(1)!==h) location.hash=h;   // shareable, no redundant history
  try{
    const d=await fetch(`/api/text/${encodeURIComponent(law)}`).then(r=>r.json());
    if(d.error){ body.textContent='No hay texto disponible para este documento.'; return; }
    document.getElementById('reader-title').textContent=d.name;
    // highlight the search terms so the reader lands near what was searched
    let html=esc(d.text);
    const terms=[...new Set(lastQuery.toLowerCase().split(/\s+/).filter(w=>w.length>3))];
    for(const t of terms.slice(0,6)){
      html=html.replace(new RegExp('('+t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi'),'<mark>$1</mark>');
    }
    body.innerHTML=html;
    // land on the first match instead of the top of a huge document
    const first=body.querySelector('mark');
    if(first) first.scrollIntoView({block:'center'}); else document.querySelector('.reader-body').scrollTop=0;
  }catch(e){ body.textContent='Error al cargar el texto.'; }
}
function closeReader(){ document.getElementById('reader').classList.remove('on'); if(location.hash.startsWith('#ley/')) history.replaceState(null,'',location.pathname+location.search); }
document.getElementById('reader-back').onclick=closeReader;
function openFromHash(){
  const m=location.hash.match(/^#ley\/(.+)$/);
  if(m) openReader(decodeURIComponent(m[1]));
}

/* ── Chat (DeepSeek, graph-grounded) ── */
const chatHistory=[];
// Wrap mentioned law names (from the server's context) so they open the reader.
function linkifyLaws(html, laws){
  const uniq=[...new Set(laws)].filter(l=>l&&l.length>6).sort((a,b)=>b.length-a.length);
  if(!uniq.length) return html;
  const re=new RegExp('('+uniq.map(l=>l.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|')+')','gi');
  return html.replace(re, m=>`<span class="law-link" data-law="${m.replace(/"/g,'&quot;')}">${m}</span>`);
}
const mdLite=s=>esc(s)
  .replace(/^\s*#{1,6}\s+(.*)$/gm,'<div class="md-h">$1</div>')   // ### headers → styled heading
  .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
  .replace(/^\s*\d+\.\s+(.*)$/gm,'<li>$1</li>')                   // 1. numbered items
  .replace(/^\s*[-•]\s+(.*)$/gm,'<li>$1</li>')
  .replace(/(<li>.*<\/li>\n?)+/g,m=>`<ul>${m.replace(/\n/g,'')}</ul>`)
  .replace(/\n{2,}/g,'<br><br>').replace(/\n/g,'<br>');

const panel=document.getElementById('chat-panel');
document.getElementById('chat-trigger').addEventListener('click',()=>{
  panel.classList.add('on'); document.getElementById('chat-input').focus();
  if(!document.getElementById('chat-msgs').children.length) addTurn('bot','Consulta el contenido de cualquier ley mexicana y sus relaciones. Respondo con base en el texto de las leyes. <em style="color:var(--text-faint)">Información general, no asesoría legal.</em>');
});
document.getElementById('chat-x').addEventListener('click',()=>panel.classList.remove('on'));

function addTurn(role,html){
  const msgs=document.getElementById('chat-msgs');
  const turn=document.createElement('div'); turn.className=`chat-turn ${role}`;
  const av=role==='user'?'Tú':'A';
  turn.innerHTML=`<div class="chat-av">${av}</div><div class="chat-bubble">${html}</div>`;
  msgs.appendChild(turn); msgs.scrollTop=msgs.scrollHeight;
  return turn.querySelector('.chat-bubble');
}
const chatInput=document.getElementById('chat-input');
chatInput.addEventListener('input',()=>{ chatInput.style.height='auto'; chatInput.style.height=Math.min(chatInput.scrollHeight,120)+'px'; });
chatInput.addEventListener('keydown',e=>{ if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); sendChat(); } });
document.getElementById('chat-send').addEventListener('click',sendChat);

async function sendChat(){
  const msg=chatInput.value.trim(); if(!msg)return;
  addTurn('user',esc(msg)); chatInput.value=''; chatInput.style.height='auto';
  const send=document.getElementById('chat-send'); send.disabled=true;
  const bubble=addTurn('bot',''); bubble.classList.add('thinking'); bubble.textContent='Consultando el grafo…';
  try{
    const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({message:msg,history:chatHistory})});
    const d=await r.json();
    bubble.classList.remove('thinking'); bubble.innerHTML=linkifyLaws(mdLite(d.response||'Sin respuesta.'), d.laws||[]);
    bubble.querySelectorAll('.law-link').forEach(el=>el.onclick=()=>openReader(el.dataset.law));
    chatHistory.push({role:'user',content:msg},{role:'assistant',content:d.response||''});
  }catch(e){ bubble.classList.remove('thinking'); bubble.innerHTML='<span style="color:#b0674a">Error de conexión.</span>'; }
  send.disabled=false; document.getElementById('chat-msgs').scrollTop=1e9;
}

/* ── Init ── */
async function init(){
  try{ clusters=await fetch('/api/clusters').then(r=>r.json()); }catch(e){ clusters={}; }
  await loadMap();
  document.getElementById('loading').style.display='none';
  openFromHash();                 // deep-link: #ley/NOMBRE opens the reader
}
window.addEventListener('hashchange', openFromHash);
init();
</script>
</body>
</html>
